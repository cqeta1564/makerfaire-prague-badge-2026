name: Build and deploy web flasher

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build firmware and Pages artifact
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build release firmware
        run: python -m platformio run -e maker_badge_esp32s2

      - name: Prepare web firmware files
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DIR=".pio/build/maker_badge_esp32s2"
          FIRMWARE_DIR="docs/firmware"

          mkdir -p "$FIRMWARE_DIR"
          cp "$BUILD_DIR/bootloader.bin" "$FIRMWARE_DIR/bootloader.bin"
          cp "$BUILD_DIR/partitions.bin" "$FIRMWARE_DIR/partitions.bin"
          cp "$BUILD_DIR/firmware.bin" "$FIRMWARE_DIR/firmware.bin"

          BOOT_APP0=""
          if [ -d "$HOME/.platformio/packages/framework-arduinoespressif32" ]; then
            BOOT_APP0="$(find "$HOME/.platformio/packages/framework-arduinoespressif32" -type f -name boot_app0.bin -print -quit)"
          fi

          if [ -z "$BOOT_APP0" ] && [ -d "$HOME/.platformio/packages" ]; then
            BOOT_APP0="$(find "$HOME/.platformio/packages" -type f -name boot_app0.bin -print -quit)"
          fi

          if [ -z "$BOOT_APP0" ]; then
            echo "boot_app0.bin was not found in PlatformIO packages." >&2
            exit 1
          fi

          cp "$BOOT_APP0" "$FIRMWARE_DIR/boot_app0.bin"

          python -m json.tool docs/manifest.json >/dev/null
          test -s "$FIRMWARE_DIR/bootloader.bin"
          test -s "$FIRMWARE_DIR/partitions.bin"
          test -s "$FIRMWARE_DIR/boot_app0.bin"
          test -s "$FIRMWARE_DIR/firmware.bin"
          ls -lh "$FIRMWARE_DIR"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
